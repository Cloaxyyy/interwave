name: Build macOS

# Builds (and optionally signs/publishes) the macOS .dmg + auto-update
# payload. Triggers on every push to main, the same as the Windows build.
#
# To enable signed releases, add these secrets in repo Settings:
#   APPLE_CERTIFICATE              — base64 of the .p12 signing cert
#   APPLE_CERTIFICATE_PASSWORD     — password for the .p12
#   APPLE_SIGNING_IDENTITY         — e.g. "Developer ID Application: …"
#   APPLE_ID                       — Apple ID for notarization
#   APPLE_PASSWORD                 — app-specific password
#   APPLE_TEAM_ID                  — your developer team ID
#
# Until those are set, the workflow still builds an unsigned .app/.dmg
# you can install locally for testing — just no auto-update publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch:   apple-silicon
          - target: x86_64-apple-darwin
            arch:   intel

    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "tag=v$v-build.${{ github.run_number }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Build release notes from commit message
        id: notes
        shell: bash
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            body=$(cat RELEASE_NOTES.md)
          else
            body=$(git log -1 --pretty=format:'%B')
          fi
          {
            echo "body<<__IW_EOF__"
            echo "$body"
            echo ""
            echo "---"
            echo "_macOS ${{ matrix.arch }} build ${{ github.run_number }} · commit \`${GITHUB_SHA::7}\`._"
            echo "__IW_EOF__"
          } >> $GITHUB_OUTPUT

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.target }}

      - name: Download yt-dlp macOS binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o "src-tauri/binaries/yt-dlp-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/yt-dlp-${{ matrix.target }}"

      - name: Build (and optionally sign + release) Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN:                       ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Apple signing — empty string when secrets aren't set, which
          # tauri-action handles gracefully (skips notarization).
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName:    ${{ steps.version.outputs.tag }}
          releaseName: "Interwave v${{ steps.version.outputs.version }} (macOS · ${{ matrix.arch }})"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease:   false
          args: --target ${{ matrix.target }} --bundles dmg,updater

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: interwave-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7
