name: Deploy interwave.cc

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'webapp/**'
      - 'shared/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Supabase config into web bundle
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Replace the __SUPABASE_URL__ / __SUPABASE_ANON__ placeholders in
          # web/index.html with the real values from repo secrets so the
          # share resolver can fetch from PostgREST anonymously.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON" ]; then
            echo "::warning::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY missing — share links will not resolve on the web until they're set."
          fi
          # Use a marker we know is in the file
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL//&/\\&}|g" web/index.html
          sed -i "s|__SUPABASE_ANON__|${SUPABASE_ANON//&/\\&}|g" web/index.html
          echo "Injected. Sample line:"
          grep -n 'SUPABASE_URL\s*=' web/index.html | head -1 | sed -E 's|(SUPABASE_URL = ).{0,12}.*|\1<redacted>|'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --no-frozen-lockfile

      - name: Build webapp
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter @interwave/webapp build

      - name: Stage webapp into Pages tree at /app/
        run: |
          rm -rf web/app
          mkdir -p web/app
          cp -R webapp/dist/. web/app/
          # Reuse the marketing favicon for the webapp so /app/favicon.svg resolves.
          cp web/favicon.svg web/app/favicon.svg
          ls -la web/app | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
